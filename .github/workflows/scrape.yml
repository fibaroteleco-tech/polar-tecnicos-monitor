name: Disparar scraper horario

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Llamar al endpoint de scraping del panel
        run: |
          curl -sf -X POST "https://polar-monitor.onrender.com/api/run-scrape" \
            -H "x-scrape-token: ${{ secrets.SCRAPE_TOKEN }}" \
            -H "Content-Type: application/json"
