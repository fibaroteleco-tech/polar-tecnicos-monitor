name: Disparador horario del scraping

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de scraping del panel
        run: |
          curl -sS -X POST "https://polar-monitor-panel.onrender.com/api/run-scrape" \
            -H "x-scrape-token: ${{ secrets.SCRAPE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --max-time 600 \
            -w "\nHTTP %{http_code}\n"
